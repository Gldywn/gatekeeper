<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="t d">
  <title id="t">Auto mode's two checks</title>
  <desc id="d">A new PostgreSQL read goes through a local analysis on your machine, then an evaluator that gets the query structure but never result rows. When both clear it, it runs without a click. Held reads wait for your review.</desc>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8f97"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#66d9df"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c6067"/></marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 16.5px; font-weight: 650; fill: #e8eaed; }
    .s { font-size: 13.5px; fill: #a3a7ad; }
    .n { font-size: 12px; font-weight: 700; fill: #0f2426; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="249" rx="16" fill="#121316" stroke="#2a2d32"/>

  <!-- new read -->
  <rect x="24" y="44" width="140" height="96" rx="12" fill="#1c1e22" stroke="#34373d"/>
  <text class="h" x="94" y="84" text-anchor="middle">A new read</text>
  <text class="s" x="94" y="108" text-anchor="middle">on PostgreSQL</text>
  <line x1="166" y1="92" x2="206" y2="92" stroke="#8a8f97" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- local analysis -->
  <rect x="212" y="30" width="244" height="128" rx="12" fill="#1c1e22" stroke="#66d9df" stroke-width="1.4"/>
  <circle cx="242" cy="60" r="11" fill="#66d9df"/>
  <text class="n" x="242" y="64.5" text-anchor="middle">1</text>
  <text class="h" x="262" y="66">Local analysis</text>
  <text class="s" x="232" y="96">On your machine. Resolves the</text>
  <text class="s" x="232" y="118">query against the live catalog.</text>
  <text class="s" x="232" y="140" style="fill:#8a8f97">Holds what it cannot clear.</text>
  <line x1="458" y1="92" x2="498" y2="92" stroke="#66d9df" stroke-width="1.6" marker-end="url(#ac)"/>

  <!-- evaluator -->
  <rect x="504" y="30" width="244" height="128" rx="12" fill="#1c1e22" stroke="#66d9df" stroke-width="1.4"/>
  <circle cx="534" cy="60" r="11" fill="#66d9df"/>
  <text class="n" x="534" y="64.5" text-anchor="middle">2</text>
  <text class="h" x="554" y="66">Evaluator</text>
  <text class="s" x="524" y="96">Gets the query's structure,</text>
  <text class="s" x="524" y="118">never result rows.</text>
  <text class="s" x="524" y="140" style="fill:#8a8f97">Hosted, or a Custom server.</text>
  <line x1="750" y1="92" x2="790" y2="92" stroke="#66d9df" stroke-width="1.6" marker-end="url(#ac)"/>

  <!-- runs -->
  <rect x="796" y="44" width="140" height="96" rx="12" fill="#16292b" stroke="#66d9df" stroke-width="1.4"/>
  <path d="M833 62 L825 76 H832 L830 86 L839 71 H832 Z" fill="#66d9df"/>
  <text x="848" y="80" style="font-size:16.5px;font-weight:650;fill:#66d9df">Runs</text>
  <text class="s" x="866" y="106" text-anchor="middle">when both clear it,</text>
  <text class="s" x="866" y="126" text-anchor="middle">without a click</text>

  <!-- held -->
  <path d="M334 160 V194" fill="none" stroke="#5c6067" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#af)"/>
  <path d="M626 160 V194" fill="none" stroke="#5c6067" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#af)"/>
  <rect x="212" y="198" width="536" height="34" rx="17" fill="#17181b" stroke="#2f3237"/>
  <text x="480" y="220" text-anchor="middle" style="font-size:13.5px;fill:#8a8f97">Held reads wait for your review.</text>
</svg>
