packages:
  - "packages/*"
  - landing

# Supply chain: refuse any dependency version published less than 7 days ago.
minimumReleaseAge: 10080

# Pin transitive deps whose latest release is inside the window to their newest
# >=7-day-old version, so the whole tree satisfies the quarantine.
overrides:
  fast-uri: 3.1.3
  hono: 4.12.30
  jose: 6.2.3
  postcss: 8.5.19

# Post-install/build scripts are blocked by default; only these audited native
# builds are allowed to run.
allowBuilds:
  esbuild: true
  better-sqlite3: true
  # sharp ships with the landing's Astro dep but is never invoked: the landing sets
  # its image service to passthrough, so no native libvips build is needed. Refused
  # deliberately (not merely un-listed) to record the decision and stop the re-prompt.
  # Flip to true only if the landing ever enables build-time image optimization.
  sharp: false
