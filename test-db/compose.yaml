# Gatekeeper local test databases. Dev only, synthetic data, never a real target.
# Host ports are deliberately unusual (54329, 33069) so this never collides with a
# real local Postgres/MySQL. Add an engine by dropping a service here plus a
# <engine>/ directory of init SQL mounted at /docker-entrypoint-initdb.d.
name: gatekeeper-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatekeeper_test
      POSTGRES_USER: gatekeeper_test
      POSTGRES_PASSWORD: gatekeeper_test
    ports:
      - "54329:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper_test -d gatekeeper_test"]
      interval: 5s
      timeout: 3s
      retries: 12

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: gatekeeper_test
      MYSQL_USER: gatekeeper_test
      MYSQL_PASSWORD: gatekeeper_test
      MYSQL_ROOT_PASSWORD: gatekeeper_test_root
    ports:
      - "33069:3306"
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "gatekeeper_test", "-pgatekeeper_test"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pg_data:
  mysql_data:
