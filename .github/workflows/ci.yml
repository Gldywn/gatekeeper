name: ci

# Validates pull requests and pushes to main: typecheck, build, test.
# Uses `pull_request` (never `pull_request_target`): a fork PR runs with a
# read-only token and no access to secrets, so building and testing untrusted
# contributor code here cannot leak anything or write to the repo.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this job only reads the code. No secret is referenced.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The token is useless after checkout; don't leave it in .git/config while
          # test code runs.
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
