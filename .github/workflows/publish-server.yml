name: publish-server

# Publishes @gldywn/gatekeeper-mcp-server to npm, which is what makes the one-line
# `npx -y @gldywn/gatekeeper-mcp-server` install work.
#
# Triggered by a human publishing the draft release (release-please drafts it, a human
# reviews the attached plugin assets and clicks Publish). That human-attributed event does
# trigger workflows, unlike anything release-please creates with the default GITHUB_TOKEN.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish from (e.g. v0.1.0).
        required: true
        type: string

permissions:
  contents: read
  # Required for npm provenance, and for npm trusted publishing if it is configured.
  id-token: write

jobs:
  # The notification helper is a signed macOS .app, so it cannot be produced on the
  # ubuntu publish runner. It is built here and handed over as an artifact. Ad-hoc
  # signing needs no certificate and no secret.
  notifier:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Build the notification helper
        run: bash packages/server/notifier/build.sh

      # Each of these has already shipped a silently broken notifier in some project:
      # a missing slice, a lost execute bit, a stale signature, an embedded symlink.
      - name: Check the bundle
        working-directory: packages/server
        run: |
          bundle="notifier.noindex/Gatekeeper.app"
          binary="$bundle/Contents/MacOS/gatekeeper-notify"
          lipo -info "$binary" | grep -q 'x86_64' || { echo "::error::missing x86_64 slice"; exit 1; }
          lipo -info "$binary" | grep -q 'arm64' || { echo "::error::missing arm64 slice"; exit 1; }
          codesign --verify --deep --strict "$bundle"
          [ -x "$binary" ] || { echo "::error::helper is not executable"; exit 1; }
          [ -z "$(find "$bundle" -type l)" ] || { echo "::error::bundle contains a symlink"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notifier
          path: packages/server/notifier.noindex
          retention-days: 1

  publish:
    needs: notifier
    runs-on: ubuntu-latest
    steps:
      # Both halves live under the always-available `github` context: the `inputs`
      # context is only populated for workflow_dispatch and workflow_call, and this
      # workflow also runs on `release`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: notifier
          path: packages/server/notifier.noindex

      # Artifact upload does not carry file modes, so the helper arrives non-executable.
      # publishConfig.executableFiles is what actually fixes the mode in the tarball;
      # this keeps the working tree honest and lets the assertion below mean something.
      - name: Restore the helper's execute bit
        run: chmod +x packages/server/notifier.noindex/Gatekeeper.app/Contents/MacOS/gatekeeper-notify

      - name: Check the package version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          version="${TAG#v}"
          package_version="$(jq -r '.version' packages/server/package.json)"
          if [ "$package_version" != "$version" ]; then
            echo "::error::packages/server is at $package_version but the release tag is $TAG."
            exit 1
          fi

      - name: Typecheck, build and test
        run: pnpm run ci

      # pnpm strips the execute bit from anything outside `bin` unless publishConfig names
      # it, and npm's installer honours the stored mode, so a mistake here would ship a
      # helper that can never run. After the build, so this packs the same tree as publish.
      - name: Check the packed tarball keeps the execute bit
        working-directory: packages/server
        run: |
          tarball="$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)"
          mode="$(tar -tvf "$tarball" | grep 'MacOS/gatekeeper-notify' | awk '{print $1}')"
          echo "packed as $mode"
          case "$mode" in *x*) ;; *) echo "::error::execute bit stripped by pack"; exit 1 ;; esac

      # Trusted publishing via OIDC (id-token: write above): no token. npm, not pnpm,
      # because pnpm 11's OIDC token exchange 404s (pnpm/pnpm#11513); npm's is reliable.
      - name: Publish to npm
        working-directory: packages/server
        run: npm publish --access public --provenance
