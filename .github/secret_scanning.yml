# Gatekeeper ships secret-shaped strings on purpose (it is a tool about gating
# secrets): test fixtures like `password: "secret"` / `Bearer secret`, and the
# disposable throwaway passwords of the local test databases. Keep those out of
# secret-scanning alerts. Push protection is a separate control and is unaffected
# by this file, so a real accidental secret is still blocked at push time.
paths-ignore:
  - "**/*.test.ts"
  - "test-db/**"
